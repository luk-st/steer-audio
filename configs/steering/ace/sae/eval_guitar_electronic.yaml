# ABOUTME: SAE eval config for 'guitar_electronic' at its HOLDOUT-OPTIMAL per-layer top-k
# ABOUTME: (tf6=5, tf7=50) with renorm — the argmax of the 2D sweep's composite score over
# ABOUTME: MuQ-T/CLAP x both directions. Ranges seeded from eval_locren_guitar_electronic x this arm's
# ABOUTME: alpha_max ratio vs the (20,20) arm; probe-calibrated in-job.
method: sae
concept: guitar_electronic
min-range: -16.1788
max-range: 9.9113
steps-per-side: 15
method-kwargs:
  hookpoints:
    - artifact: lukasz-staniszewski/ace-step-sae-tf6-cross-attn
      hookpoint: transformer_blocks.6.cross_attn
      scores_cache_path: lukasz-staniszewski/ace-step-sae-scores-guitar-electronic
      score_filename: tf6_scores.pkl
      intervention_mode: steering_vector
      selection_method: tfidf
      top_k: 5
      renorm: true
    - artifact: lukasz-staniszewski/ace-step-sae-tf7-cross-attn
      hookpoint: transformer_blocks.7.cross_attn
      scores_cache_path: lukasz-staniszewski/ace-step-sae-scores-guitar-electronic
      score_filename: tf7_scores.pkl
      intervention_mode: steering_vector
      selection_method: tfidf
      top_k: 50
      renorm: true
duration: 30.0
steps: 30
guidance-scale: 5.0
seed: 2115
save-dir: outputs/eval/sae_guitar_electronic
