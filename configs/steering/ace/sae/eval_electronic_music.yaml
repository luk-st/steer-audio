# ABOUTME: SAE eval config for 'electronic_music' at its HOLDOUT-OPTIMAL per-layer top-k
# ABOUTME: (tf6=100, tf7=10) with renorm — the argmax of the 2D sweep's composite score over
# ABOUTME: MuQ-T/CLAP x both directions. Ranges seeded from eval_locren_electronic_music x this arm's
# ABOUTME: alpha_max ratio vs the (20,20) arm; probe-calibrated in-job.
method: sae
concept: electronic_music
min-range: -31.5621
max-range: 46.0969
steps-per-side: 15
method-kwargs:
  hookpoints:
    - artifact: lukasz-staniszewski/ace-step-sae-tf6-cross-attn
      hookpoint: transformer_blocks.6.cross_attn
      scores_cache_path: lukasz-staniszewski/ace-step-sae-scores-electronic-music
      score_filename: tf6_scores.pkl
      intervention_mode: steering_vector
      selection_method: tfidf
      top_k: 100
      renorm: true
    - artifact: lukasz-staniszewski/ace-step-sae-tf7-cross-attn
      hookpoint: transformer_blocks.7.cross_attn
      scores_cache_path: lukasz-staniszewski/ace-step-sae-scores-electronic-music
      score_filename: tf7_scores.pkl
      intervention_mode: steering_vector
      selection_method: tfidf
      top_k: 10
      renorm: true
duration: 30.0
steps: 30
guidance-scale: 5.0
seed: 2115
save-dir: outputs/eval/sae_electronic_music
