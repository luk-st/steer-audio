# ABOUTME: SAE score computation for 'electronic_music' on the unified CONCEPT_TO_PROMPTS pairs, into a
# ABOUTME: curprompt dir so all 9 concepts share one score provenance (fp32 encode, sidecar json).
scorer: sae-scores
concept: electronic_music
output: steering_vectors/sae/ace_electronic_music_curprompt
scorer-kwargs:
  layers: [tf7, tf6]
  num_inference_steps: 30
  guidance_scale: 5.0
  audio_length_in_s: 30.0
  seed: 10
