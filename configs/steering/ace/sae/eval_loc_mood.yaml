# SAE feature-steering, dual-hookpoint (tf6 + tf7).
# Per the paper: tfidf feature selection, top_k=20 at tf7, top_k=5 at tf6.
method: sae
artifact: lukasz-staniszewski/ace-step-sae-tf7-cross-attn
concept: mood
min-range: -24.0
max-range: 16.0
steps-per-side: 15
method-kwargs:
  hookpoint: transformer_blocks.7.cross_attn
  scores_cache_path: lukasz-staniszewski/ace-step-sae-scores-mood
  score_filename: tf7_scores.pkl
  intervention_mode: steering_vector
  selection_method: tfidf
  top_k: 20
duration: 30.0
steps: 30
guidance-scale: 5.0
seed: 2115
save-dir: outputs/eval/sae_loc_mood
