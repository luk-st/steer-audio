# @package _global_

defaults:
  - _self_
  - patch_model: audioldm2_patch
  - patch_config: audioldm2
  - patch_layers: audioldm2/no_layers
  - patch_data: example_prompts
  - paths: default
  - extras: default
  - experiment: null

task_name: "generate_with_patch"

# Cap the number of (clean, corrupted) prompt pairs to use for patching.
# null = use every pair returned by the loader (after feature filtering).
# Useful for quick smoke tests, e.g. `prompt_limit=4`.
prompt_limit: null

tags: ["dev"]
